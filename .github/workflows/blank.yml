  - name: Verificar arquivos
        run: |
          echo "=== Arquivos na raiz ==="
          ls -la
          echo "=== Arquivos Gradle encontrados ==="
          find . -maxdepth 6 -type f \( -name build.gradle -o -name build.gradle.kts -o -name settings.gradle -o -name settings.gradle.kts \)
          echo "=== Pastas de módulos ==="
          find . -maxdepth 4 -type d

      - name: Gerar APK
        run: |
          if [ ! -f settings.gradle ] && [ ! -f settings.gradle.kts ]; then
            echo "ERRO: arquivo settings.gradle ou settings.gradle.kts não encontrado na raiz."
            exit 1
          fi
          if [ ! -d app ]; then
            echo "ERRO: pasta app não existe. É necessário localizar o módulo Android."
            exit 1
          fi
          gradle assembleDebug


    
