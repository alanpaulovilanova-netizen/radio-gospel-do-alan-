name: Gerar APK Android


on:
  workflow_dispatch:
  push:
    branches:
      - main
      - principal

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v5

      - name: Verificar arquivos
        run: |
          ls -la
          find . -maxdepth 5 -type f \( -name gradlew -o -name settings.gradle -o -name settings.gradle.kts \)

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Gerar APK
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug
          else
            echo "ERRO: gradlew não encontrado na raiz."
            exit 1
          fi

      - name: Disponibilizar APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: aplicativo-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
