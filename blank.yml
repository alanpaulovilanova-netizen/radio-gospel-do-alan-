
name: Gerar APK Android

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - principal

permissions:
  contents: read

jobs:
  build:
    name: Construir APK
    runs-on: ubuntu-24.04

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v5

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Verificar arquivos
        run: |
          echo "Arquivos na raiz:"
          ls -la
          echo "Arquivos Gradle:"
          find . -maxdepth 6 -type f \( -name settings.gradle -o -name settings.gradle.kts -o -name build.gradle -o -name build.gradle.kts \)

      - name: Verificar projeto Android
        run: |
          if [ ! -f settings.gradle ] && [ ! -f settings.gradle.kts ]; then
            echo "ERRO: arquivo settings.gradle(.kts) não encontrado na raiz."
            exit 1
          fi

          if [ ! -d app ]; then
            echo "ERRO: pasta app não encontrada."
            exit 1
          fi

          if [ ! -f app/build.gradle ] && [ ! -f app/build.gradle.kts ]; then
            echo "ERRO: arquivo de configuração do módulo app não encontrado."
            exit 1
          fi

      - name: Gerar APK
        run: gradle assembleDebug

      - name: Disponibilizar APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Radio-Gospel-do-Alan-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
